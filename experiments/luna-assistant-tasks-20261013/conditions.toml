# One block per setup. The agent's instructions are the listed parts (prompts/<part>.md) joined in order.
# Defaults: model gpt-6-luna, reasoning effort "low".

[luna_none]
about = "No added sentence."
parts = ["paper_base"]
timeout = 300

[luna_ask]
about = "Ask the user when something is unclear."
parts = ["paper_base", "ask"]
timeout = 300

[luna_a]
about = "Sentence A of the first study."
parts = ["paper_base", "sentence_a"]
timeout = 300

[luna_b]
about = "Sentence B of the first study."
parts = ["paper_base", "sentence_b"]
timeout = 300

[luna_c]
about = "Sentence C of the first study."
parts = ["paper_base", "sentence_c"]
timeout = 300

[luna_high]
about = "No added sentence, reasoning effort high."
parts = ["paper_base"]
effort = "high"
timeout = 480

[sol_none]
about = "No added sentence, model gpt-6.1-sol."
parts = ["paper_base"]
model = "gpt-6.1-sol"
timeout = 300
